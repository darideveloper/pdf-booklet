[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-booklet"
dynamic = ["version"]
description = "Impose a PDF as nested signatures for hand folding and sewing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dari Developer", email = "darideveloper@gmail.com" }]
keywords = ["pdf", "booklet", "imposition", "signature", "print"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = ["pymupdf>=1.24"]

[project.scripts]
pdf-booklet = "booklet:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "booklet.py"

[tool.hatch.build.targets.wheel]
only-include = ["booklet.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
